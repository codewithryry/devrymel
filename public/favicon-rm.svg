<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #26292e; }
    .mark { fill: #fbfaf7; }
    /* Flip colors when the browser tab bar is dark */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f1f2f3; }
      .mark { fill: #15171a; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <text
    class="mark"
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Manrope, 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="-1"
  >RM</text>
</svg>
